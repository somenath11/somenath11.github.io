<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadowCB" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGradCB)"/>
  
  <!-- Outer Border -->
  <rect x="24" y="24" width="752" height="452" rx="12" fill="none" stroke="#eab308" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="32" y="32" width="736" height="436" rx="8" fill="none" stroke="#eab308" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Top Header Diamond Emblem -->
  <g transform="translate(400, 75)">
    <polygon points="0,-22 18,0 0,22 -18,0" fill="url(#yellowGrad)" filter="url(#shadowCB)"/>
    <polygon points="0,-12 10,0 0,12 -10,0" fill="#18181b"/>
  </g>

  <!-- Sub Header -->
  <text x="400" y="145" text-anchor="middle" fill="#facc15" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" letter-spacing="3">COMMONWEALTH BANK &amp; FORAGE</text>
  <text x="400" y="175" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" letter-spacing="4">JOB SIMULATION CERTIFICATE</text>

  <!-- Divider Line -->
  <line x1="250" y1="195" x2="550" y2="195" stroke="#eab308" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Certificate Title -->
  <text x="400" y="250" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="26" font-weight="700">Introduction to Data Science Job Simulation</text>

  <!-- Recipient / Subtext -->
  <text x="400" y="295" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="15" font-weight="400">Awarded to <tspan fill="#facc15" font-weight="600">Somenath Sau</tspan></text>
  <text x="400" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="13">Completed practical data science modeling &amp; analytical tasks</text>

  <!-- Bottom Verification Footer -->
  <g transform="translate(0, 380)">
    <!-- Left Yellow Seal -->
    <g transform="translate(100, 35)">
      <circle cx="0" cy="0" r="22" fill="url(#yellowGrad)" opacity="0.9"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M-8 0 L-2 6 L8 -4" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Center Credential ID -->
    <text x="400" y="30" text-anchor="middle" fill="#52525b" font-family="monospace" font-size="12">VERIFICATION CODE: smwfytX3mcLboA9bf</text>
    <text x="400" y="48" text-anchor="middle" fill="#facc15" font-family="'Outfit', sans-serif" font-size="12" font-weight="600">ISSUED: MAY 2025</text>

    <!-- Right Brand Badge -->
    <g transform="translate(680, 30)">
      <rect x="-40" y="-15" width="80" height="30" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#eab308" font-family="'Outfit', sans-serif" font-size="12" font-weight="800">Forage</text>
    </g>
  </g>
</svg>
