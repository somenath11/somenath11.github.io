<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032b43"/>
      <stop offset="50%" stop-color="#001a2e"/>
      <stop offset="100%" stop-color="#02101e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadowCog" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGradCog)"/>
  
  <!-- Outer Border -->
  <rect x="24" y="24" width="752" height="452" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="32" y="32" width="736" height="436" rx="8" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Top Header Cognizant Branding -->
  <g transform="translate(400, 75)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" letter-spacing="2">cognizant</text>
  </g>

  <!-- Sub Header -->
  <text x="400" y="145" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" letter-spacing="3">COGNIZANT &amp; FORAGE</text>
  <text x="400" y="175" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" letter-spacing="4">ARTIFICIAL INTELLIGENCE CERTIFICATE</text>

  <!-- Divider Line -->
  <line x1="250" y1="195" x2="550" y2="195" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Certificate Title -->
  <text x="400" y="250" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="28" font-weight="700">Artificial Intelligence Job Simulation</text>

  <!-- Recipient / Subtext -->
  <text x="400" y="295" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="15" font-weight="400">Awarded to <tspan fill="#38bdf8" font-weight="600">Somenath Sau</tspan></text>
  <text x="400" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="13">Explored AI concepts, computer vision &amp; machine learning workflows</text>

  <!-- Bottom Verification Footer -->
  <g transform="translate(0, 380)">
    <!-- Left Cyan Seal -->
    <g transform="translate(100, 35)">
      <circle cx="0" cy="0" r="22" fill="url(#cyanGrad)" opacity="0.9"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M-8 0 L-2 6 L8 -4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Center Credential ID -->
    <text x="400" y="30" text-anchor="middle" fill="#475569" font-family="monospace" font-size="12">VERIFICATION CODE: 5N2ygyhzMWjKQmgCK</text>
    <text x="400" y="48" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="600">ISSUED: JUNE 2024</text>

    <!-- Right Brand Badge -->
    <g transform="translate(680, 30)">
      <rect x="-40" y="-15" width="80" height="30" rx="6" fill="#001a2e" stroke="#1e3a5f" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="800">Forage</text>
    </g>
  </g>
</svg>
